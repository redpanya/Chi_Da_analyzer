name: Windows 화자 실행 도구
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Windows-x64-${{ matrix.backend }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [sherpa, pyannote]
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYANNOTE_METRICS_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packaging/speaker_tools/requirements-*-windows.txt
      - name: 공식 PyTorch CPU wheel 설치
        if: matrix.backend == 'pyannote'
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu torchaudio==2.8.0+cpu
      - name: 도구별 고정 의존성 설치
        run: |
          python -m pip install -r packaging/speaker_tools/requirements-${{ matrix.backend }}-windows.txt
          python -m pip check
      - name: 실행 도구·고지·대응 소스 제작
        run: python packaging/speaker_tools/build.py ${{ matrix.backend }} --output dist/speaker-tools/${{ matrix.backend }}
      - name: 실제 ZIP 설치·재실행·입력 검증
        run: python packaging/speaker_tools/smoke.py ${{ matrix.backend }} --output dist/speaker-tools/${{ matrix.backend }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: speaker-tools-Windows-x64-${{ matrix.backend }}
          path: |
            dist/speaker-tools/${{ matrix.backend }}/*.zip
            dist/speaker-tools/${{ matrix.backend }}/*.json
            dist/speaker-tools/${{ matrix.backend }}/*.txt
          if-no-files-found: error
          retention-days: 14
